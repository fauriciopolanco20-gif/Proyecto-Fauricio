<!DOCTYPE html>
<html>
<head>
    <title>Detalle Cliente</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">📊 Sistema de Clientes</span>
        </div>
    </nav>
    
    <div class="container mt-5">
    
        <div class="row justify-content-center">
    
            <div class="col-md-6">
    
                <div class="card border-0 shadow-lg rounded-4">
    
                    <div class="card-header bg-primary text-white text-center fs-5">
                        👤 Detalle del Cliente
                    </div>
    
                    <div class="card-body p-4">
    
                        <div class="mb-3 p-2 bg-light rounded">
                            <strong>ID:</strong> {{ cliente.id }}
                        </div>
    
                        <div class="mb-3 p-2 bg-light rounded">
                            <strong>Nombre:</strong> {{ cliente.nombre }}
                        </div>
    
                        <div class="mb-3 p-2 bg-light rounded">
                            <strong>Vendedor:</strong> {{ cliente.nombreEmpleado.nombre }}
                        </div>
    
                        <div class="mb-3">
                            <strong>Estado:</strong>
                            <span class="badge bg-success">Activo</span>
                        </div>
    
                        <a href="/clientes/" class="btn btn-secondary w-100 mt-3">
                            ⬅ Volver
                        </a>
    
                    </div>
    
                </div>
    
            </div>
    
        </div>
    
    </div>
    
    </body>
