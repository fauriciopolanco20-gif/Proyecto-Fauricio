{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>

<body class="login-body">

<div class="login-card">

    <div class="text-center mb-4">
        <div class="mb-3 d-inline-block p-3 rounded-circle bg-indigo-light" style="background-color: rgba(99, 102, 241, 0.15); width: 64px; height: 64px;">
            <i class="bi bi-shield-lock-fill text-indigo fs-2" style="color: var(--primary-indigo);"></i>
        </div>
        <h3 class="fw-bold mb-1">Iniciar Sesión</h3>
        <p class="text-muted mb-0" style="font-size: 0.9rem;">Acceso al panel de administración</p>
    </div>

    {% if error %}
        <div class="alert alert-danger text-center border-0 p-2 mb-4" style="background-color: rgba(244, 63, 94, 0.2); color: #fda4af; border-radius: 10px; font-size: 0.9rem;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- Usuario -->
        <div class="mb-3">
            <label class="form-label text-white-50 small mb-1">Usuario</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" name="usuario" class="form-control" placeholder="Escriba su usuario" required autocomplete="username">
            </div>
        </div>

        <!-- Contraseña -->
        <div class="mb-4">
            <label class="form-label text-white-50 small mb-1">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password" class="form-control" placeholder="Escriba su contraseña" required autocomplete="current-password">
            </div>
        </div>

        <!-- Botón Ingresar -->
        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2 py-2 fs-6 shadow">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
            </button>
        </div>

    </form>

</div>

</body>
</html>
