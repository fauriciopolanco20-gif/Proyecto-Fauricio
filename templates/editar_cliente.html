{% extends 'base.html' %}

{% block title %}
Editar Cliente | Sistema
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        
        <div class="card border-0 shadow-sm p-4">
            <div class="card-body">
                
                <h3 class="fw-bold text-dark mb-4" style="letter-spacing: -0.03em;">
                    <i class="bi bi-pencil-square text-warning me-2"></i>Editar Cliente
                </h3>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Campo Nombre -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-person me-1 text-muted"></i> Nombre Completo del Cliente
                        </label>
                        <input 
                            type="text"
                            name="nombre"
                            value="{{ cliente.nombre }}"
                            class="form-control"
                            required>
                        <div class="form-text text-muted">Modifique el nombre o razón social del cliente.</div>
                    </div>

                    <!-- Campo Empleado Encargado -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-person-badge me-1 text-muted"></i> Asesor / Empleado Encargado
                        </label>
                        <select name="empleado" class="form-select">
                            <option value="">
                                -- Sin asignar asesor --
                            </option>
                            {% for empleado in empleados %}
                            <option value="{{ empleado.id }}"
                            {% if cliente.empleado and cliente.empleado.id == empleado.id %}
                                selected
                            {% endif %}>
                                {{ empleado.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="form-text text-muted">Reasigne el asesor encargado del seguimiento.</div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex gap-2 mt-5">
                        <button type="submit" class="btn btn-success text-white d-inline-flex align-items-center gap-2 px-4">
                            <i class="bi bi-check-circle-fill"></i> Guardar Cambios
                        </button>
                        <a href="/clientes/" class="btn btn-secondary d-inline-flex align-items-center gap-2 px-4">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
