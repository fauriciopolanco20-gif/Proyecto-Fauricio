<!DOCTYPE html>
<html>
<head>
    <title>Editar Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="mb-4">✏ Editar Cliente</h3>

            <form method="POST">
                {% csrf_token %}

               
                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text"
                           name="nombre"
                           value="{{ cliente.nombre }}"
                           class="form-control">
                </div>

              
                <div class="mb-3">
                    <label>Empleado encargado</label>

                    <select name="empleado" class="form-select">

                        <option value="">
                            -- Sin asignar --
                        </option>

                        {% for empleado in empleados %}

                        <option value="{{ empleado.id }}"
                        {% if cliente.nombreEmpleado and cliente.nombreEmpleado.id == empleado.id %}
                            selected
                        {% endif %}
                        >
                            {{ empleado.nombre }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <button class="btn btn-success">
                    💾 Guardar Cambios
                </button>

                <a href="javascript:history.back()" class="btn btn-secondary">
                    ⬅ Volver
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
