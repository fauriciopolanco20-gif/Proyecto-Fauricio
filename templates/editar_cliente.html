{% extends 'base.html' %}


{% block title %}
Editar Cliente
{% endblock %}



{% block content %}



<div class="container mt-4">


    <div class="card shadow">


        <div class="card-body">


            <h3 class="mb-4">
                ✏ Editar Cliente
            </h3>



            <form method="POST">


                {% csrf_token %}



                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>


                    <input 
                        type="text"
                        name="nombre"
                        value="{{ cliente.nombre }}"
                        class="form-control">

                </div>




                <div class="mb-3">


                    <label class="form-label">
                        Empleado encargado
                    </label>



                    <select name="empleado" class="form-select">


                        <option value="">
                            -- Sin asignar --
                        </option>




                        {% for empleado in empleados %}



                        <option value="{{ empleado.id }}"

                        {% if cliente.empleado and cliente.empleado.id == empleado.id %}
                            selected
                        {% endif %}
                        
                        >

                            {{ empleado.nombre }}

                        </option>



                        {% endfor %}



                    </select>



                </div>




                <button class="btn btn-success">
                    💾 Guardar Cambios
                </button>




                <a href="/clientes/" class="btn btn-secondary">
                    ⬅ Volver
                </a>



            </form>


        </div>


    </div>


</div>



{% endblock %}
