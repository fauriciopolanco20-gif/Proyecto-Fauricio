{% extends 'base.html' %}


{% block title %}
Nuevo Empleado
{% endblock %}



{% block content %}



<div class="container mt-4">


    <div class="card shadow p-4">


        <h3 class="mb-4">
            👨‍💼 Nuevo Empleado
        </h3>



        <form method="POST">


            {% csrf_token %}



            <div class="mb-3">


                <label class="form-label">
                    Nombre del empleado
                </label>



                <input 
                    type="text"
                    name="nombre"
                    class="form-control"
                    placeholder="Ingrese nombre"
                    required>


            </div>




            <button class="btn btn-success">

                Guardar Empleado

            </button>




            <a href="/empleados/" class="btn btn-secondary">

                Cancelar

            </a>



        </form>


    </div>


</div>



{% endblock %}
