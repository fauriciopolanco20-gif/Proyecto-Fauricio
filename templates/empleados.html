<!DOCTYPE html>
<html>

<head>

    <title>Empleados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            👨‍💼 Sistema de Empleados
        </span>

    </div>

</nav>



<div class="container mt-4">


    <div class="d-flex justify-content-between align-items-center mb-3">


        <h3>
            Lista de Empleados
        </h3>

        <form method="GET" class="d-flex mb-3">

            <input 
                type="text"
                name="buscar"
                class="form-control"
                placeholder="Buscar empleado..."
                value="{{ buscar|default:'' }}">
        
        
            <button class="btn btn-dark ms-2">
                🔎 Buscar
            </button>
        
        </form>


        <div>


            <a href="/empleado/crear/" class="btn btn-success">
                ➕ Nuevo Empleado
            </a>


            <a href="/home/" class="btn btn-secondary">
                ⬅ Volver
            </a>


        </div>


    </div>




    <div class="card shadow">


        <div class="card-body">


            <table class="table table-bordered table-hover">


                <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Nombre</th>

                        <th>Fecha</th>

                        <th>Acciones</th>

                    </tr>

                </thead>



                <tbody>


                    {% for empleado in empleados %}

                    <tr>


                        <td>
                            {{ empleado.id }}
                        </td>


                        <td>
                            {{ empleado.nombre }}
                        </td>


                        <td>
                            {{ empleado.fecha|date:"d/m/Y H:i" }}
                        </td>



                        <td>


                            <a href="/empleado/editar/{{ empleado.id }}/"
                               class="btn btn-warning btn-sm">

                               ✏ Editar

                            </a>



                            <a href="/empleado/eliminar/{{ empleado.id }}/"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Seguro que deseas eliminar este empleado?')">

                               🗑 Eliminar

                            </a>


                        </td>


                    </tr>


                    {% empty %}

                    <tr>

                        <td colspan="4" class="text-center">

                            No hay empleados registrados

                        </td>

                    </tr>


                    {% endfor %}


                </tbody>


            </table>


        </div>


    </div>


</div>



</body>

</html>
