{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sistema Django
        {% endblock %}
    </title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">

        <a class="navbar-brand" href="/home/">
            <i class="bi bi-cpu-fill me-2"></i>Mi Sistema Django
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/home/"><i class="bi bi-speedometer2 me-1"></i> Inicio</a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/clientes/"><i class="bi bi-people me-1"></i> Clientes</a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/empleados/"><i class="bi bi-briefcase me-1"></i> Empleados</a>
                </li>

            </ul>


            <a class="btn btn-danger d-inline-flex align-items-center gap-2" href="/logout/">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </a>


        </div>

    </div>
</nav>


<div class="container mt-5 mb-5">


    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-custom alert-custom-success shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <div>
                    {{ message }}
                </div>
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
