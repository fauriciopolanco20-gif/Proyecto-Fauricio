{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Sistema Django{% endblock %} · Mi Sistema
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos propios -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">

        <a class="navbar-brand" href="/home/">
            <span class="brand-mark"><i class="bi bi-hexagon-fill"></i></span>
            Mi Sistema
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/home/"><i class="bi bi-speedometer2 me-1"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/clientes/"><i class="bi bi-people me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/empleados/"><i class="bi bi-person-badge me-1"></i>Empleados</a>
                </li>
            </ul>

            <a class="btn btn-logout" href="/logout/">
                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
            </a>

        </div>

    </div>
</nav>


<div class="container page-wrap">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success mt-4">
                <i class="bi bi-check-circle-fill me-1"></i>{{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<footer class="app-footer">
    Mi Sistema · Panel de administración
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
