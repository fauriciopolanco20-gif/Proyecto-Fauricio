{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Mi Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body class="login-page">

<div class="login-card">

    <div class="login-mark"><i class="bi bi-hexagon-fill"></i></div>

    <h3>Iniciar sesión</h3>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    {% if error %}
        <div class="alert alert-danger text-center" style="border-left-color:#dc2626;">
            Usuario o contraseña incorrectos
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="usuario" class="form-control" placeholder="Tu usuario" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <div class="d-grid">
            <button class="btn btn-login text-white">
                Ingresar <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </div>

    </form>

</div>

</body>
</html>
