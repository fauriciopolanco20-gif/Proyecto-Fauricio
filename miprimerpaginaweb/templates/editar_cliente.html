{% extends 'base.html' %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="page-header">
            <div class="page-eyebrow">Clientes</div>
            <h3><i class="bi bi-pencil-square me-2"></i>Editar cliente</h3>
        </div>

        <div class="card">
            <div class="card-body p-4">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input
                            type="text"
                            name="nombre"
                            value="{{ cliente.nombre }}"
                            class="form-control">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Empleado encargado</label>
                        <select name="empleado" class="form-select">
                            <option value="">-- Sin asignar --</option>
                            {% for empleado in empleados %}
                            <option value="{{ empleado.id }}"
                                {% if cliente.empleado and cliente.empleado.id == empleado.id %}selected{% endif %}>
                                {{ empleado.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>Guardar cambios
                        </button>
                        <a href="/clientes/" class="btn btn-secondary">Volver</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
